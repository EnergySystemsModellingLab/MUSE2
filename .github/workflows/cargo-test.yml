name: Cargo Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build_and_test:
    name: Run tests
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            coverage: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Run cargo test
        shell: bash
        env:
          MUSE2_TEST_OUTPUT_DIR: test_results
        run: |
          mkdir $MUSE2_TEST_OUTPUT_DIR
          cargo test --verbose --no-fail-fast

      # Upload regression test results for analysis
      - uses: actions/upload-artifact@v7
        if: "!cancelled()"
        with:
          name: muse2_test_results_${{ matrix.os }}
          path: test_results

      - if: ${{ matrix.coverage }}
        uses: ./.github/actions/codecov
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  benchmark:
    name: Run benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Restore benchmark data
        uses: actions/cache@v4
        with:
          path: cache/benchmark-data.json
          # Unique key per run so each run saves a new entry; restore-keys finds
          # the most recent previous entry when the exact key is not yet cached.
          key: benchmark-data-${{ github.run_id }}
          restore-keys: benchmark-data-

      - name: Ensure benchmark cache directory exists
        run: mkdir -p cache

      - name: Run cargo bench
        shell: bash
        run: cargo bench --features bench --no-fail-fast | tee output.txt

      - name: Convert Criterion results to JSON
        shell: python3 {0}
        run: |
          import json
          from pathlib import Path

          criterion_dir = Path("target/criterion")
          results = []

          # Walk every new/estimates.json produced by Criterion.
          # The path structure is:
          #   target/criterion/<group>/<bench_id>/new/estimates.json
          # where Criterion sanitises any '/' in a group name to '_'.
          # Stripping the leading criterion_dir and trailing new/estimates.json
          # gives a stable, human-readable name that is consistent across runs.
          for estimates_file in sorted(criterion_dir.rglob("new/estimates.json")):
              parts = estimates_file.relative_to(criterion_dir).parts[:-2]
              name = "/".join(parts)
              data = json.loads(estimates_file.read_text())
              value = data["median"]["point_estimate"]
              results.append({"name": name, "value": value, "unit": "ns"})

          Path("benchmark-results.json").write_text(json.dumps(results, indent=2))
          print(f"Converted {len(results)} Criterion benchmark results to benchmark-results.json")
          for r in results:
              print(f"  {r['name']}: {r['value']:.0f} ns")

      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: "customSmallerIsBetter"
          output-file-path: benchmark-results.json
          external-data-json-path: ./cache/benchmark-data.json
          fail-on-alert: true
          # GitHub API token to make a commit comment
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Enable alert commit comment
          comment-on-alert: true
          # Enable Job Summary for PRs
          summary-always: true

      # actions/cache automatically saves cache/benchmark-data.json at the end
      # of the job via its post step, keyed with the run-specific key above.
