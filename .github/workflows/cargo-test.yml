name: Cargo Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build_and_test:
    name: Run tests
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            coverage: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Run cargo test
        shell: bash
        env:
          MUSE2_TEST_OUTPUT_DIR: test_results
        run: |
          mkdir $MUSE2_TEST_OUTPUT_DIR
          cargo test --verbose --no-fail-fast

      # Upload regression test results for analysis
      - uses: actions/upload-artifact@v7
        if: "!cancelled()"
        with:
          name: muse2_test_results_${{ matrix.os }}
          path: test_results

      - if: ${{ matrix.coverage }}
        uses: ./.github/actions/codecov
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  benchmark:
    name: Run benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # needed to push the updated baseline back to the repo
      pull-requests: write # needed to post a comment when an alert is triggered
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Run cargo bench
        shell: bash
        run: cargo bench --features bench --no-fail-fast

      - name: Convert Criterion results to JSON
        run: python3 benches/convert_criterion_output.py

      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: "customSmallerIsBetter"
          output-file-path: benchmark-results.json
          external-data-json-path: ./benches/benchmark-data.json
          # Fail the workflow if any benchmark regresses by more than 30% relative
          # to the stored baseline. CI runners have variable load, so a threshold
          # that is too tight will cause spurious failures; 130% is a reasonable
          # starting point and can be tightened once baseline stability is known.
          alert-threshold: "130%"
          fail-on-alert: true
          # GitHub API token to make a commit comment
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Post a comment on the commit when an alert is triggered, listing which
          # benchmarks regressed and by how much.
          comment-on-alert: true
          # Always write a job summary table, not only when a regression is found.
          summary-always: true

      - name: Create pull request with updated baseline
        # Only update the stored baseline when code is merged to main. On pull
        # requests the job reads the baseline for comparison but must not overwrite
        # it, since the PR branch has not yet been reviewed and merged.
        # The PR is opened using GITHUB_TOKEN, which means GitHub's built-in
        # anti-recursion protection applies: the pull_request event fired by
        # creating this PR will not trigger a new workflow run.
        # [skip ci] in the commit message and title prevents a redundant workflow
        # run when the PR is squash-merged back to main.
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: update benchmark baseline [skip ci]"
          branch: chore/benchmark-baseline
          delete-branch: true
          title: "chore: update benchmark baseline [skip ci]"
          body: |
            Automated update of the benchmark baseline data after a push to `main`.

            > [!NOTE]
            > Merge using **Squash merge** to ensure the `[skip ci]` tag is
            > preserved in the merge commit, preventing a redundant benchmark run.
          add-paths: benches/benchmark-data.json
