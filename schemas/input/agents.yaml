$schema: https://specs.frictionlessdata.io/schemas/table-schema.json
description: Describes agents in the system
fields:
  - name: id
    type: string
    description: A unique identifier for an agent
  - name: description
    type: string
    description: A human-readable label for the agent
  - name: regions
    type: string
    description: The region(s) in which the agent operates
    notes: One or more region IDs, separated by semicolons or the string `all`
  - name: agent_type
    type: string
    enum: [competitive, portfolio]
    description: The asset selection algorithm used by the agent
    notes: |
      Optional (defaults to `competitive`). With `competitive`, existing and candidate assets
      compete in rounds, with the best option according to the agent's objective selected in each
      round. With `portfolio`, the capacities of all existing and candidate assets are chosen
      together in a single optimisation.
  - name: decision_rule
    type: string
    description: The decision rule applied to objectives
    notes: Currently the only supported rule is `single`
  - name: decision_lexico_tolerance
    type: number
    description: Tolerance for `lexico` decision rule
    notes: Currently unused
