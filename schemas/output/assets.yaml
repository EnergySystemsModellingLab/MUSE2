$schema: https://specs.frictionlessdata.io/schemas/table-schema.json
description: Assets commissioned during the course of the simulation.

fields:
  - name: asset_id
    type: string
    description: The ID number of this asset
  - name: process_id
    type: string
    description: The ID of this asset's associated process
  - name: region_id
    type: string
    description: The region in which this asset exists
  - name: agent_id
    type: string
    description: The agent to which this asset belongs
  - name: commission_year
    type: integer
    description: The year in which the asset was commissioned
