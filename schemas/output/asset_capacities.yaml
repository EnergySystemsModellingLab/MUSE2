$schema: https://specs.frictionlessdata.io/schemas/table-schema.json
description: Capacity of each asset at each milestone year during the simulation.

fields:
  - name: milestone_year
    type: integer
    description: The milestone year of the simulation
  - name: asset_id
    type: string
    description: The ID of this asset
  - name: capacity
    type: number
    description: The total capacity of the asset in this year
  - name: num_tranches
    type: integer
    description: The total number of tranches making up the asset in this year
  - name: mothballed_capacity
    type: number
    description: The capacity of the asset that is mothballed in this year
  - name: mothballed_units
    type: integer
    description: The number of tranches that are mothballed in this year
